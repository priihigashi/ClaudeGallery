<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florida Real Estate Exam Quiz</title>
<style>
  :root { --green:#2e7d32; --red:#c62828; --blue:#1565c0; --bg:#f5f6fa; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; background: var(--bg); margin:0; padding:20px; color:#222; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.3em; color: var(--blue); margin: 0 0 4px; }
  .sub { color:#666; font-size:.85em; margin-bottom:16px; }
  .card { background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:16px; }
  .score { display:flex; gap:16px; font-size:.9em; color:#444; margin-bottom:12px; flex-wrap:wrap; }
  .score b { font-size:1.1em; }
  .qnum { color:#888; font-size:.8em; margin-bottom:6px; }
  .qtext { font-size:1.08em; line-height:1.5; margin-bottom:18px; }
  .opt { display:block; width:100%; text-align:left; margin:8px 0; padding:13px 16px; border:2px solid #d8dce6;
         border-radius:9px; background:#fff; font:inherit; font-size:1em; cursor:pointer; line-height:1.4; }
  .opt:hover:not(:disabled) { border-color: var(--blue); background:#f0f6ff; }
  .opt:disabled { cursor:default; opacity:.92; }
  .opt.correct { border-color:var(--green); background:#e8f5e9; font-weight:bold; }
  .opt.wrong { border-color:var(--red); background:#ffebee; }
  .feedback { margin-top:14px; padding:14px; border-radius:9px; font-size:.95em; line-height:1.5; display:none; }
  .feedback.good { display:block; background:#e8f5e9; border-left:5px solid var(--green); }
  .feedback.bad { display:block; background:#ffebee; border-left:5px solid var(--red); }
  .ref { color:#555; font-size:.85em; margin-top:8px; font-style:italic; }
  .nav { display:flex; gap:10px; margin-top:16px; }
  button.btn { padding:11px 22px; border:none; border-radius:9px; font:inherit; font-size:1em; cursor:pointer; background:var(--blue); color:#fff; }
  button.btn.gray { background:#9aa0ae; }
  .summary h2 { color: var(--blue); }
  .missed { background:#fff8f8; border:1px solid #f3c0c0; border-radius:9px; padding:12px 14px; margin:10px 0; font-size:.92em; }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.75em; background:#e3ecf9; color:var(--blue); margin-left:8px; }
  .bar { height:10px; background:#e3e6ee; border-radius:99px; overflow:hidden; margin:8px 0 0; }
  .bar i { display:block; height:100%; background:var(--blue); transition:width .3s; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏠 Florida Real Estate Exam Practice</h1>
  <div class="sub">Your approved study deck · Source shown after each answer</div>

  <div class="card" id="quizCard">
    <div class="score">
      <span>Question <b id="qPos">1</b> / <b id="qTotal">?</b></span>
      <span>✅ Correct: <b id="nRight">0</b></span>
      <span>❌ Wrong: <b id="nWrong">0</b></span>
      <span>Score: <b id="pct">–</b></span>
    </div>
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <div class="qnum" id="qSrc"></div>
    <div class="qtext" id="qText"></div>
    <div id="opts"></div>
    <div class="feedback" id="fb"></div>
    <div class="nav">
      <button class="btn" id="nextBtn" style="display:none">Next question →</button>
    </div>
  </div>

  <div class="card summary" id="summaryCard" style="display:none">
    <h2>Session complete! 🎉</h2>
    <p id="finalLine"></p>
    <div id="missedList"></div>
    <div class="nav">
      <button class="btn" id="restartBtn">Start a new session</button>
      <button class="btn gray" id="reviewMissedBtn" style="display:none">Practice missed only</button>
    </div>
  </div>
</div>

<script>
const BANK = [{"id": "ch8-q01", "source": "Chapter 8 Practice Exam", "sourceRef": "Q1", "bookPage": null, "question": "All of the following estates include legal title to real property, EXCEPT:", "options": {"a": "Tenancy for years", "b": "Fee simple estate", "c": "Life estate", "d": "Tenancy by the entireties"}, "finalAnswer": "a", "aiReasoning": "A tenancy for years is a leasehold estate — possession only, no legal title. Fee simple, life estate, and tenancy by the entireties are freehold/ownership interests that include title."}, {"id": "ch8-q02", "source": "Chapter 8 Practice Exam", "sourceRef": "Q2", "bookPage": null, "question": "Florida timeshare projects are regulated by which organization?", "options": {"a": "Florida Real Estate Commission", "b": "Department of Community Affairs", "c": "Division of Florida Condominiums, Timeshares, and Mobile Homes", "d": "Department of Housing and Urban Development"}, "finalAnswer": "c", "aiReasoning": "The Division of Florida Condominiums, Timeshares, and Mobile Homes (within the DBPR) regulates timeshare projects under Ch. 721 F.S. FREC regulates licensees, not timeshare projects."}, {"id": "ch8-q03", "source": "Chapter 8 Practice Exam", "sourceRef": "Q3", "bookPage": null, "question": "Able, who holds title in fee simple, deeds land to Baker to enjoy until his death. At that time, Charlie is to receive title to the land. Baker's interest in the land is known as which of the following?", "options": {"a": "Fee simple estate", "b": "Life estate", "c": "Remainder estate", "d": "Estate for years"}, "finalAnswer": "b", "aiReasoning": "Baker holds the land until his death — the classic definition of a life estate; Baker is the life tenant."}, {"id": "ch8-q04", "source": "Chapter 8 Practice Exam", "sourceRef": "Q4", "bookPage": null, "question": "Based on the information in the previous question, Charlie's interest in the land is which of the following?", "options": {"a": "Reversion estate", "b": "Remainder estate", "c": "Estate for years", "d": "Joint estate"}, "finalAnswer": "b", "aiReasoning": "Title passes to a third party (Charlie) at the end of the life estate, making Charlie the remainderman. If title returned to the grantor (Able), it would be a reversion."}, {"id": "ch8-q05", "source": "Chapter 8 Practice Exam", "sourceRef": "Q5", "bookPage": null, "question": "What rights allow a property owner to have reasonable use of water flowing over or through their land?", "options": {"a": "Riparian", "b": "Littoral", "c": "Flowage", "d": "Aquifer"}, "finalAnswer": "a", "aiReasoning": "Riparian rights apply to flowing water (rivers, streams). Littoral rights apply to standing bodies of water such as lakes and oceans."}, {"id": "ch8-q06", "source": "Chapter 8 Practice Exam", "sourceRef": "Q6", "bookPage": null, "question": "A potential purchaser of a new timeshare can cancel the contract without penalty within how many days?", "options": {"a": "10", "b": "20", "c": "30", "d": "40"}, "finalAnswer": "a", "aiReasoning": "Florida law (Ch. 721 F.S.) gives timeshare purchasers a 10-day cancellation (rescission) period."}, {"id": "ch8-q07", "source": "Chapter 8 Practice Exam", "sourceRef": "Q7", "bookPage": null, "question": "Which statement best describes a tenancy at will?", "options": {"a": "The tenant suffers from the landlord's failure to maintain the property.", "b": "The landlord suffers from the tenant's failure to pay rent.", "c": "The lease instrument is valid.", "d": "A lease which can be terminated at the will of the landlord or tenant by giving legal notice."}, "finalAnswer": "d", "aiReasoning": "A tenancy at will continues indefinitely until either party terminates it by giving proper legal notice."}, {"id": "ch8-q08", "source": "Chapter 8 Practice Exam", "sourceRef": "Q8", "bookPage": null, "question": "Which of the following best describes a tenancy at sufferance?", "options": {"a": "The tenant suffers from the landlord's failure to maintain the property", "b": "The landlord suffers from the tenant's failure to pay rent", "c": "The lease instrument is valid", "d": "The tenant remained in possession after expiration of a lease"}, "finalAnswer": "d", "aiReasoning": "A tenancy at sufferance arises when a tenant stays (holds over) after the lease has expired, without the landlord's consent."}, {"id": "ch8-q09", "source": "Chapter 8 Practice Exam", "sourceRef": "Q9", "bookPage": null, "question": "What is the elective share right in Florida?", "options": {"a": "50% of real estate only", "b": "30% of the real and personal property owned at the time of death", "c": "30% of all property owned and obtained by the decedent during the marriage", "d": "One-third of all property"}, "finalAnswer": "b", "aiReasoning": "Florida's elective share entitles a surviving spouse to 30% of the ELECTIVE ESTATE (F.S. 732.2065) — a statutorily defined pool that includes the probate estate plus certain non-probate assets. Option b ('30% of the real and personal property owned at the time of death') is the course's simplification and the best available answer."}, {"id": "ch8-q10", "source": "Chapter 8 Practice Exam", "sourceRef": "Q10", "bookPage": null, "question": "What does the bundle of rights in real property include?", "options": {"a": "Destruction, use, and extinction", "b": "Destruction, use, and enjoyment", "c": "Use, expropriation, and enjoyment", "d": "Disposition, enjoyment, and exclusion"}, "finalAnswer": "d", "aiReasoning": "The bundle of rights is commonly summarized as disposition, use, enjoyment, possession, and exclusion (DUE PE). Option d is the only one listing valid bundle rights."}, {"id": "ch8-q11", "source": "Chapter 8 Practice Exam", "sourceRef": "Q11", "bookPage": null, "question": "Which of the following are the tests used by courts to determine whether an item is real or personal property?", "options": {"a": "Intent, relationship of the parties, method of annexation, and adaptation", "b": "Intent, abandonment, redemption, and accretion", "c": "Size, annexation, avulsion, and adaptation", "d": "Intent, size, annexation, and redemption"}, "finalAnswer": "a", "aiReasoning": "The fixture tests are: intent of the parties, relationship of the parties, method of annexation, and adaptation of the item to the property's use."}, {"id": "ch8-q12", "source": "Chapter 8 Practice Exam", "sourceRef": "Q12", "bookPage": null, "question": "What are the four unities required to create a joint tenancy?", "options": {"a": "Interest, survivorship, possession, and time", "b": "Possession, deed, title, and time", "c": "Possession, interest, time, and title", "d": "Person, use, interest, and purpose"}, "finalAnswer": "c", "aiReasoning": "The four unities of a joint tenancy are Possession, Interest, Time, and Title (PITT). Survivorship is a feature of joint tenancy, not one of the unities."}, {"id": "ch8-q13", "source": "Chapter 8 Practice Exam", "sourceRef": "Q13", "bookPage": null, "question": "The law of descent and distribution passes what percentage to a surviving spouse if there are no lineal descendants?", "options": {"a": "30%", "b": "33%", "c": "50%", "d": "100%"}, "finalAnswer": "d", "aiReasoning": "Under Florida intestate succession (F.S. 732.102), if there are no lineal descendants the surviving spouse receives the entire estate — 100%."}, {"id": "ch8-q14", "source": "Chapter 8 Practice Exam", "sourceRef": "Q14", "bookPage": null, "question": "Which of the following is a form of corporate ownership that allows possession under a proprietary lease?", "options": {"a": "Condominium", "b": "Tenancy in common", "c": "Joint tenancy", "d": "Cooperative"}, "finalAnswer": "d", "aiReasoning": "In a cooperative, a corporation owns the building; residents own shares and occupy units under a proprietary lease."}, {"id": "ch8-q15", "source": "Chapter 8 Practice Exam", "sourceRef": "Q15", "bookPage": null, "question": "Paul and Paula are spouses. They own property as tenants by the entireties. They divorce without a property settlement. Unless otherwise decreed by a court, they now hold the property title as which of the following?", "options": {"a": "Joint tenants", "b": "Tenants in common", "c": "Tenants by the entireties", "d": "Joint tenants with the right of survivors"}, "finalAnswer": "b", "aiReasoning": "Divorce destroys the unity of marriage required for tenancy by the entireties; absent a court decree, the ex-spouses become tenants in common."}, {"id": "ch7-q01", "source": "Chapter 7 Practice Exam", "sourceRef": "Q1", "bookPage": null, "question": "What was the significance of the 1968 Jones v. Mayer Supreme Court ruling?", "options": {"a": "Handicap and familial status protections were added.", "b": "Certain exemptions were upheld for racial discrimination.", "c": "Discrimination based on race was strictly prohibited, preventing exceptions of any kind.", "d": "Persons with AIDS or HIV were designated as handicapped."}, "finalAnswer": "c", "aiReasoning": "Jones v. Mayer (1968) upheld the Civil Rights Act of 1866: racial discrimination in property transactions is prohibited with NO exceptions."}, {"id": "ch7-q02", "source": "Chapter 7 Practice Exam", "sourceRef": "Q2", "bookPage": null, "question": "All of the following are correct regarding the Americans with Disabilities Act, EXCEPT:", "options": {"a": "Owners must make all accessibility modifications with no regard to the cost of improvement.", "b": "ADA is intended to eliminate barriers that limit access to persons with disabilities.", "c": "ADA mandates certain design specifications for accessibility.", "d": "Owners of property open to the public may be required to remove barriers to accessibility."}, "finalAnswer": "a", "aiReasoning": "ADA requires barrier removal only when 'readily achievable' — cost IS considered, so statement a is false."}, {"id": "ch7-q03", "source": "Chapter 7 Practice Exam", "sourceRef": "Q3", "bookPage": null, "question": "Under the Florida Residential Landlord and Tenant Act, a landlord is required to do all of the following, EXCEPT:", "options": {"a": "Bargain in good faith", "b": "Provide maintenance sufficient to comply with code", "c": "Notify the tenants within 30 days of the manner in which security deposits and advance rents are being held", "d": "Deposit advance rent and security deposits in an interest-bearing account"}, "finalAnswer": "d", "aiReasoning": "An interest-bearing account is only ONE of the landlord's options (non-interest-bearing account or surety bond are also allowed), so it is not required."}, {"id": "ch7-q04", "source": "Chapter 7 Practice Exam", "sourceRef": "Q4", "bookPage": null, "question": "If a security deposit is held by a landlord, what is the landlord required to do?", "options": {"a": "Deposit the funds in compliance with F.S. 475", "b": "Notify the tenant of the location of the funds within 20 days of receipt of the funds", "c": "Pay interest at the rate of 5% per year, with disbursements at least once each year", "d": "Return the funds within 15 days after the tenant vacates the premises or give notice within 30 days of the intention to impose a claim against the security deposit by certified mail"}, "finalAnswer": "d", "aiReasoning": "F.S. 83.49(3)(a): return deposit within 15 days, or give written notice by certified mail within 30 days of intent to impose a claim."}, {"id": "ch7-q05", "source": "Chapter 7 Practice Exam", "sourceRef": "Q5", "bookPage": null, "question": "What term is used to describe a situation in which a real estate licensee tells a customer that an advertised property is NOT available for sale when, in fact, it is?", "options": {"a": "Steering", "b": "Restricting", "c": "Conspiring", "d": "Blockbusting"}, "finalAnswer": "a", "aiReasoning": "Misrepresenting that an advertised property is not available when it is, is a fair-housing violation classified in course materials as steering (channeling buyers away from a property/neighborhood). Blockbusting is panic-selling inducement; the other options are not fair-housing terms. Dual-audit concurrence."}, {"id": "ch7-q06", "source": "Chapter 7 Practice Exam", "sourceRef": "Q6", "bookPage": null, "question": "What term is used to describe the actions of a broker who induces an owner to list or sell on the basis that the neighborhood is deteriorating due to minority influences?", "options": {"a": "Steering", "b": "Channeling", "c": "Conspiring", "d": "Blockbusting"}, "finalAnswer": "d", "aiReasoning": "Inducing owners to sell by exploiting fears of minority entry is blockbusting (panic selling)."}, {"id": "ch7-q07", "source": "Chapter 7 Practice Exam", "sourceRef": "Q7", "bookPage": null, "question": "All of the following are protected classes under the 1988 Amendment to the 1968 Fair Housing Act, EXCEPT:", "options": {"a": "People with physical or mental impairments that do not limit major life activities", "b": "Individuals with drug addiction problems who are not current users", "c": "Persons with acquired immune deficiency syndrome (AIDS) and recovering alcoholics", "d": "Women who are pregnant and people with children under the age of 18"}, "finalAnswer": "a", "aiReasoning": "Handicap protection requires an impairment that substantially limits a major life activity; impairments that do NOT limit major life activities are not covered."}, {"id": "ch7-q08", "source": "Chapter 7 Practice Exam", "sourceRef": "Q8", "bookPage": null, "question": "A property owner is registered on both the state and federal “do not call” lists. Which statement correctly applies to solicitation calls to this owner by a licensee?", "options": {"a": "Calls may be made only between 9:00 a.m. and 8:00 p.m.", "b": "Calls may not be made when representing a buyer.", "c": "Calls could result in a fine of up to $15,000.", "d": "Calls are not permitted when attempting to obtain a listing."}, "finalAnswer": "d", "aiReasoning": "Calling an owner on the do-not-call registries to solicit a LISTING is prohibited telephone solicitation (the licensee is marketing brokerage services). Calling on behalf of a buyer to offer to purchase is not 'solicitation' of the called party. Fine-amount options vary by edition and are distractors. Dual-audit concurrence."}, {"id": "ch7-q09", "source": "Chapter 7 Practice Exam", "sourceRef": "Q9", "bookPage": null, "question": "A real estate licensee refuses to show properties in high-end neighborhoods to minority buyers. The licensee is engaged in which illegal practice?", "options": {"a": "Blockbusting", "b": "Redirecting", "c": "Steering", "d": "Redlining"}, "finalAnswer": "c", "aiReasoning": "Channeling buyers toward or away from neighborhoods based on protected class is steering."}, {"id": "ch7-q10", "source": "Chapter 7 Practice Exam", "sourceRef": "Q10", "bookPage": null, "question": "A real estate licensee attempts to induce sellers to list and sell their properties by starting rumors that minorities are taking over a neighborhood. What could the licensee be charged with?", "options": {"a": "Steering", "b": "Blockbusting", "c": "Redlining", "d": "Channeling"}, "finalAnswer": "b", "aiReasoning": "Starting panic rumors to induce listings/sales is the definition of blockbusting."}, {"id": "ch7-q11", "source": "Chapter 7 Practice Exam", "sourceRef": "Q11", "bookPage": null, "question": "The Fair Housing Act of 1968 prohibits discrimination based on which of the following?", "options": {"a": "Age", "b": "Marital status", "c": "Occupation", "d": "National origin"}, "finalAnswer": "d", "aiReasoning": "The 1968 Act covered race, color, religion, and national origin (sex added 1974; handicap and familial status added 1988). Age, marital status, and occupation are not federal fair-housing classes."}, {"id": "ch7-q12", "source": "Chapter 7 Practice Exam", "sourceRef": "Q12", "bookPage": null, "question": "Which legislation prohibited discrimination based on religion?", "options": {"a": "Civil Rights Act of 1866", "b": "Civil Rights Act of 1968", "c": "Civil Rights Act of 1964", "d": "1988 Fair Housing Amendment"}, "finalAnswer": "b", "aiReasoning": "The Civil Rights Act of 1968 (Title VIII, Fair Housing Act) added religion as a protected class in housing; the 1866 Act covered race only."}, {"id": "ch7-q13", "source": "Chapter 7 Practice Exam", "sourceRef": "Q13", "bookPage": null, "question": "What is the maximum fine that may be imposed for a first time violation of the Florida Fair Housing Act?", "options": {"a": "$5,000", "b": "$10,000", "c": "$25,000", "d": "$50,000"}, "finalAnswer": "b", "aiReasoning": "First violation: up to $10,000 civil penalty ($25,000 for a second within 5 years; $50,000 for further violations within 7 years)."}, {"id": "ch7-q14", "source": "Chapter 7 Practice Exam", "sourceRef": "Q14", "bookPage": null, "question": "What is the first step in the eviction process?", "options": {"a": "The landlord notifies the tenant that they must cure the problem within a specified time period or vacate the property.", "b": "The sheriff posts a 24-hour notice of removal on the tenant's door.", "c": "The county clerk issues an eviction summons.", "d": "The landlord files a motion for default."}, "finalAnswer": "a", "aiReasoning": "Eviction begins with the statutory notice to the tenant (e.g., 3-day notice for nonpayment) to cure or vacate; court steps come later."}, {"id": "ch7-q15", "source": "Chapter 7 Practice Exam", "sourceRef": "Q15", "bookPage": null, "question": "When may a landlord commingle a tenant's security deposit with other business funds?", "options": {"a": "When the landlord pays the tenant 75% of the interest earned", "b": "When the landlord deposits the funds into a non-interest-bearing escrow account", "c": "When the landlord posts a surety bond", "d": "When the landlord places the funds into an escrow account controlled by the property management company"}, "finalAnswer": "c", "aiReasoning": "F.S. 83.49 allows commingling only if the landlord posts a surety bond (and pays the tenant 5% simple interest)."}, {"id": "ch6-q01", "source": "Chapter 6 Practice Review Questions", "sourceRef": "Q1", "bookPage": null, "question": "What is the purpose of the disciplinary guidelines?", "options": {"a": "To extend the meaning of the law", "b": "To specify and implement the law", "c": "To give new meaning to the law", "d": "To give licensees notice of the range of penalties that normally will be imposed for violation of a law or rule"}, "finalAnswer": "d", "aiReasoning": "Disciplinary guidelines exist to give licensees notice of the usual range of penalties for each violation."}, {"id": "ch6-q02", "source": "Chapter 6 Practice Review Questions", "sourceRef": "Q2", "bookPage": null, "question": "Who reports findings of fact to the Commission at the conclusion of a formal hearing?", "options": {"a": "An attorney", "b": "The Division of Real Estate investigator", "c": "The Division of Real Estate prosecutors", "d": "The administrative law judge"}, "finalAnswer": "d", "aiReasoning": "The administrative law judge conducts the formal hearing and submits a recommended order with findings of fact to FREC."}, {"id": "ch6-q03", "source": "Chapter 6 Practice Review Questions", "sourceRef": "Q3", "bookPage": null, "question": "What happens if a respondent fails to answer an administrative complaint?", "options": {"a": "The defendant will be issued a subpoena.", "b": "The Commission will dismiss charges against the licensee.", "c": "The Commission will proceed with the hearing.", "d": "The Department of Business and Professional Regulation will send investigators to arrest the licensee."}, "finalAnswer": "c", "aiReasoning": "Failure to respond does not stop the process; the case proceeds (the licensee waives the right to dispute the facts)."}, {"id": "ch6-q04", "source": "Chapter 6 Practice Review Questions", "sourceRef": "Q4", "bookPage": null, "question": "The range of penalties that may be imposed on a licensee by the Commission for violation of laws or rules includes which of the following?", "options": {"a": "Denial, reprimand, fine, probation, suspension, and revocation", "b": "Imprisonment only", "c": "A fine and imprisonment only", "d": "A fine, reprimand, denial, suspension, revocation, and imprisonment"}, "finalAnswer": "a", "aiReasoning": "FREC's administrative penalties: denial, reprimand, fine (up to $5,000/count), probation, suspension (up to 10 years), revocation. FREC cannot imprison anyone."}, {"id": "ch6-q05", "source": "Chapter 6 Practice Review Questions", "sourceRef": "Q5", "bookPage": null, "question": "An appeal of a Commission final order is filed with which of the following?", "options": {"a": "Florida Supreme Court", "b": "District Court of Appeals", "c": "County court", "d": "Department of Administrative Hearings"}, "finalAnswer": "b", "aiReasoning": "Judicial review of a FREC final order is sought in the District Court of Appeal."}, {"id": "ch6-q06", "source": "Chapter 6 Practice Review Questions", "sourceRef": "Q6", "bookPage": null, "question": "Which of the following statements best describes the Probable Cause Panel?", "options": {"a": "The Probable Cause Panel is composed of three Florida Real Estate Commission members, no more than one of which may be a lay member.", "b": "The Probable Cause Panel is an exercise of the quasi-judicial powers of the Florida Real Estate Commission.", "c": "The Probable Cause Panel determines guilt or innocence and submits a recommended order to the Florida Real Estate Commission.", "d": "The Probable Cause Panel has 30 days from receipt of a complete report to recommend dismissal or issuance of a formal complaint."}, "finalAnswer": "d", "aiReasoning": "F.S. 455.225(4): the probable cause panel must make its determination within 30 days after receipt of the final investigative report. Option a is wrong (panel is two members, at least one current FREC member); option c is wrong (the panel does not determine guilt — it decides whether probable cause exists)."}, {"id": "ch6-q07", "source": "Chapter 6 Practice Review Questions", "sourceRef": "Q7", "bookPage": 104, "question": "What is the charge for anyone found guilty of using false or misleading advertising?", "options": {"a": "Second-degree misdemeanor", "b": "Third-degree misdemeanor", "c": "First-degree misdemeanor", "d": "Third-degree felony"}, "finalAnswer": "a", "aiReasoning": "Gold Coast SalesPreBook 14th ed., p.104 penalty table: 'Disseminating false or misleading advertising [F.S. 475.42(1)(n)]' is listed under SECOND-degree misdemeanors (fine up to $500 and/or 60 days). First-degree misdemeanors are the rental-list/information violations. NOTE: original AI guess (c, first-degree) was corrected by the book and by current F.S. 475.42(2)."}, {"id": "ch6-q08", "source": "Chapter 6 Practice Review Questions", "sourceRef": "Q8", "bookPage": null, "question": "What is the maximum amount of money that can be paid from the Real Estate Recovery Fund to three persons who suffered monetary loss as the result of a fraudulent act committed by a real estate licensee and have been awarded a single judgment?", "options": {"a": "$150,000", "b": "$50,000", "c": "$25,000", "d": "$10,000"}, "finalAnswer": "b", "aiReasoning": "Recovery Fund caps: $50,000 per judgment/transaction (shared by all claimants on that judgment) and $150,000 aggregate per licensee."}, {"id": "ch6-q09", "source": "Chapter 6 Practice Review Questions", "sourceRef": "Q9", "bookPage": null, "question": "In which of the following circumstances may a citation be issued to a licensee?", "options": {"a": "When no substantial threat to the public health, safety, and welfare exists", "b": "The hearing officer recommends one", "c": "A final order was served on the licensee", "d": "A formal complaint has been received by the Department"}, "finalAnswer": "a", "aiReasoning": "Citations are for minor violations that pose no substantial threat to the public health, safety, and welfare."}, {"id": "ch6-q10", "source": "Chapter 6 Practice Review Questions", "sourceRef": "Q10", "bookPage": null, "question": "What is the maximum fine FREC can impose against a licensee who is found to be guilty of two violations of F.S. 475?", "options": {"a": "$1,000", "b": "$5,000", "c": "$7,500", "d": "$10,000"}, "finalAnswer": "d", "aiReasoning": "FREC may fine up to $5,000 per count; two violations = up to $10,000."}, {"id": "ch6-q11", "source": "Chapter 6 Practice Review Questions", "sourceRef": "Q11", "bookPage": null, "question": "What action might the Secretary of the Department of Business and Professional Regulation take against a broker whose actions pose an immediate serious danger to the safety and welfare of the public?", "options": {"a": "Suspend the licensee's license for ten years", "b": "Issue a summary suspension", "c": "Issue a cease-and-desist order", "d": "Place the licensee on probation"}, "finalAnswer": "b", "aiReasoning": "Immediate serious danger triggers a summary (emergency) suspension issued by the DBPR Secretary."}, {"id": "ch6-q12", "source": "Chapter 6 Practice Review Questions", "sourceRef": "Q12", "bookPage": null, "question": "What action may be taken if either the Florida Real Estate Commission or the licensee disagrees with a recommended order submitted by the administrative law judge?", "options": {"a": "Seek adjudication", "b": "Submit the matter to mediation", "c": "File exceptions", "d": "Request novation"}, "finalAnswer": "c", "aiReasoning": "Either party may file written exceptions to the ALJ's recommended order before FREC issues the final order."}, {"id": "ch6-q13", "source": "Chapter 6 Practice Review Questions", "sourceRef": "Q13", "bookPage": null, "question": "How is the Real Estate Recovery Fund funded?", "options": {"a": "Property tax dollars", "b": "The Florida State Treasury", "c": "State intangible taxes", "d": "Fees and fines paid by real estate licensees"}, "finalAnswer": "d", "aiReasoning": "The Recovery Fund is funded by a portion of license fees and fines collected from licensees."}, {"id": "ch6-q14", "source": "Chapter 6 Practice Review Questions", "sourceRef": "Q14", "bookPage": null, "question": "What must an unlicensed individual do when ordered to appear before the DBPR?", "options": {"a": "Nothing; the Department has no jurisdiction over unlicensed persons.", "b": "Appear", "c": "File an appeal", "d": "Bring an attorney"}, "finalAnswer": "b", "aiReasoning": "DBPR has authority over unlicensed activity and can subpoena anyone; the individual must appear."}, {"id": "ch6-q15", "source": "Chapter 6 Practice Review Questions", "sourceRef": "Q15", "bookPage": 104, "question": "Which activity would be classified as a first-degree misdemeanor under F.S. 475?", "options": {"a": "Placing false or misleading advertising", "b": "Violation of rental information rules", "c": "Submitting false information in an application", "d": "An unlicensed person operating as a broker"}, "finalAnswer": "b", "aiReasoning": "Gold Coast SalesPreBook 14th ed., p.104: 'First-Degree Misdemeanors ... Violating the requirements concerning rental lists, information, and contracts' (F.S. 475.453) — punishable by up to $1,000 and/or 1 year. False/misleading advertising (option a) is second-degree per the same table; unlicensed practice and false application info are third-degree felonies."}, {"id": "ch6-q16", "source": "Chapter 6 Practice Review Questions", "sourceRef": "Q16", "bookPage": null, "question": "A sales contract specifies that the buyer will pay a secondary deposit by March 15th. The sales associate neglected to collect the deposit on time. Which of the following statements is correct?", "options": {"a": "The sales associate is not responsible for collecting the deposit; this is the broker's responsibility.", "b": "The broker should notify the FREC of an escrow dispute.", "c": "By forgetting to collect the deposit, the sales associate may cause harm to the seller, and could be charged with culpable negligence.", "d": "The sales associate may be charged with conversion."}, "finalAnswer": "c", "aiReasoning": "Neglecting a duty that harms a party is culpable negligence; conversion means misappropriating funds, which did not occur."}, {"id": "ch4-q04", "source": "Chapter 4 Quiz (missed questions)", "sourceRef": "Q4", "bookPage": null, "question": "In which of the following situations does a general agency relationship exist?", "options": {"a": "When a broker is employed to market a property", "b": "When a sales associate is working with a customer", "c": "When a sales associate is employed by a broker", "d": "When a broker is employed by a buyer"}, "finalAnswer": "c", "aiReasoning": "Per Gold Coast explanation: a sales associate is a general agent of the broker (continuing authority limited to the brokerage business). A broker employed to market a property is a special agent."}, {"id": "ch4-q11", "source": "Chapter 4 Quiz (missed questions)", "sourceRef": "Q11", "bookPage": null, "question": "All of the following provide control of agency relationships in real estate, EXCEPT:", "options": {"a": "F.S. 475", "b": "Common law", "c": "The Brokerage Relationship Disclosure Act", "d": "The Department of Financial Services"}, "finalAnswer": "d", "aiReasoning": "Per Gold Coast explanation: F.S. 475, common law, and the Brokerage Relationship Disclosure Act all govern agency; the Department of Financial Services does not."}, {"id": "ch4-q13", "source": "Chapter 4 Quiz (missed questions)", "sourceRef": "Q13", "bookPage": null, "question": "A broker has appointed two sales associates to act as agents in a nonresidential transaction, one for the seller and one for the buyer. Which statement is correct?", "options": {"a": "This is an illegal dual agency.", "b": "The sales associates are referred to as designated sales associates.", "c": "Buyer and seller must have combined assets of $1 million.", "d": "The FREC will revoke the licenses of the broker and both sales associates."}, "finalAnswer": "b", "aiReasoning": "Per Gold Coast explanation: in nonresidential transactions where buyer and seller EACH have $1 million+ in assets, the broker may appoint designated sales associates. (Option c is wrong because assets are per party, not combined.)"}, {"id": "ch4-q23", "source": "Chapter 4 Quiz (missed questions)", "sourceRef": "Q23", "bookPage": null, "question": "A seller with nonrepresentation (no brokerage relationship) informed an agent that he is selling his home due to a divorce, and would take $20,000 below market value. The agent told a potential buyer to offer $20,000 less and mentioned the divorce. Which statement is correct?", "options": {"a": "The agent should not have disclosed this information due to limited confidentiality, and disciplinary action may be taken by the FREC.", "b": "The agent has an implied loyalty to the seller to obtain offers as close to market value as possible.", "c": "The agent may disclose the above information in a No Brokerage Relationship.", "d": "The agent was in compliance by telling the buyer to offer less, but violated the law by telling the buyer about the divorce."}, "finalAnswer": "c", "aiReasoning": "Per Gold Coast explanation: with no brokerage relationship the licensee owes only honest/fair dealing, disclosure of material facts, and accounting - there is no duty of confidentiality, so the disclosure is permitted."}, {"id": "ch5-q01", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q1", "bookPage": null, "question": "A sales associate licensed with a real estate brokerage corporation can be which of the following?", "options": {"a": "An officer", "b": "A stockholder", "c": "A director", "d": "An officer and a director"}, "finalAnswer": "b", "aiReasoning": "Per Gold Coast explanation: a sales/broker associate cannot be an officer or director of a brokerage corporation, but anyone may be a stockholder."}, {"id": "ch5-q02", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q2", "bookPage": null, "question": "Six individuals decide to form a real estate brokerage partnership. All six individuals are planning to be active in real estate sales. Which statement best applies?", "options": {"a": "The partnership must be registered with the Department, and all six partners must be active real estate brokers.", "b": "At least one partner must be licensed as an active broker.", "c": "Only two partners must have a real estate license.", "d": "A partnership cannot be formed as a brokerage business."}, "finalAnswer": "a", "aiReasoning": "Per Gold Coast explanation: every partner who provides real estate services must hold an active broker's license; since all six will be active in sales, all six must be active brokers and the partnership must be registered with the DBPR."}, {"id": "ch5-q03", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q3", "bookPage": null, "question": "Which of the following statements is correct regarding a licensed broker associate who is with a real estate brokerage partnership?", "options": {"a": "The broker associate may be a member of the partnership.", "b": "The broker associate may make earnest money deposits with the broker's permission.", "c": "The broker associate must hold an active broker's license.", "d": "The broker associate may not provide real estate brokerage services to others."}, "finalAnswer": "b", "aiReasoning": "Per Gold Coast explanation: a broker associate may perform sales-associate duties such as depositing escrow funds with the broker's permission, but cannot be a partner."}, {"id": "ch5-q04", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q4", "bookPage": null, "question": "All of the following business formations can register to conduct real estate transactions, EXCEPT:", "options": {"a": "Corporation for profit", "b": "Not-for-profit corporation", "c": "Corporation sole", "d": "Limited partnership"}, "finalAnswer": "c", "aiReasoning": "Per Gold Coast explanation: a corporation sole (religious entity) cannot register as a real estate brokerage."}, {"id": "ch5-q08", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q8", "bookPage": null, "question": "Who has the right to inspect a broker's escrow account records?", "options": {"a": "The parties to a real estate transaction", "b": "The Department of Business and Professional Regulation or its authorized representatives", "c": "The state Attorney General", "d": "A public defender"}, "finalAnswer": "b", "aiReasoning": "Per Gold Coast explanation: the broker must make escrow records available to the DBPR or its authorized representatives."}, {"id": "ch5-q09", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q9", "bookPage": null, "question": "All of the following businesses are required to file documents with the state, EXCEPT:", "options": {"a": "Corporation for profit", "b": "Not-for-profit corporation", "c": "Corporation sole", "d": "Cooperative association"}, "finalAnswer": "c", "aiReasoning": "Per Gold Coast explanation: a corporation sole is not required to file any documents with the state."}, {"id": "ch5-q10", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q10", "bookPage": null, "question": "Which condition would require a location to be registered as a brokerage branch office?", "options": {"a": "Tables and chairs are provided for sales associates and customers", "b": "The location is used as a shelter to get out of the sun or rain", "c": "Literature which contains the broker's office address is handed out", "d": "Sales associates are permanently assigned to the location"}, "finalAnswer": "d", "aiReasoning": "Per Gold Coast explanation: a temporary shelter is not a branch office unless transactions are closed there or sales associates are permanently assigned."}, {"id": "ch5-q11", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q11", "bookPage": null, "question": "Which statement best describes the office sign requirements for a brokerage office?", "options": {"a": "Only one sign per firm is required regardless of the number of offices.", "b": "Each sales associate associated with the firm must have a separate sign.", "c": "Every active broker must maintain a sign at each brokerage office or branch office.", "d": "Office signs are permitted but not required by law."}, "finalAnswer": "c", "aiReasoning": "Per Gold Coast explanation: a broker must have an easily readable sign at the entrance of the office and all branch offices."}, {"id": "ch5-q19", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q19", "bookPage": null, "question": "A buyer drops off an escrow check on Tuesday. To avoid any trouble with the Commission, the broker must deposit the check by close of business on which day?", "options": {"a": "The following Monday", "b": "Wednesday", "c": "Thursday", "d": "Friday"}, "finalAnswer": "d", "aiReasoning": "Per Gold Coast explanation: 'immediately' means by the end of the third business day following receipt - Wednesday, Thursday, Friday - so Friday is the deadline."}, {"id": "ch5-q20", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q20", "bookPage": null, "question": "When two or more parties participate together in one transaction where no formal paperwork or registration is completed, which type of business relationship has typically been formed?", "options": {"a": "Joint venture", "b": "Corporation", "c": "General partnership", "d": "Limited partnership"}, "finalAnswer": "a", "aiReasoning": "Per Gold Coast explanation: a joint venture is a temporary business for a single transaction, formed orally or in writing with no state filing."}, {"id": "ch5-q21", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q21", "bookPage": null, "question": "Which statement regarding the registration of real estate branch offices is true?", "options": {"a": "A broker may conduct business from more than one unregistered office as long as the principal office is registered with the DBPR.", "b": "A brokerage branch office may be closed and reopened at the same location during the same license period by requesting a reissue.", "c": "When a registered branch office is moved, a fee must be paid, but a new application for registration is not required.", "d": "A temporary shelter must always be registered as a branch office."}, "finalAnswer": "b", "aiReasoning": "Per Gold Coast explanation: if a branch office is closed and reopened at the same location during the same 2-year license period, a reissue may be requested without additional fee."}, {"id": "ch5-q23", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q23", "bookPage": null, "question": "In which of the following institutions may a broker place escrow deposits?", "options": {"a": "Title companies, banks, savings and loan associations, and credit unions", "b": "Mortgage companies, savings and loan associations, finance companies, and credit unions", "c": "Insurance companies, savings and loan associations, credit unions, and title companies", "d": "Stock brokers, finance companies, banks, savings and loan associations, and mortgage companies"}, "finalAnswer": "a", "aiReasoning": "Per Gold Coast explanation: escrow accounts may be placed in a Florida commercial bank, credit union, savings association, or title company with trust powers - never a stock brokerage."}, {"id": "ch5-q24", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q24", "bookPage": null, "question": "Four individuals wish to form a real estate brokerage partnership. All partners will work with buyers and sellers, showing properties and taking listings. Which statement best describes the necessary legal requirements?", "options": {"a": "All partners must be licensed as active brokers.", "b": "The partners are not required to have real estate licenses, but the profits must be distributed equally amongst all four partners.", "c": "The partnership must be registered with the Department of Business & Professional Regulation and at least one partner must be licensed as an active broker.", "d": "At least one partner must be licensed as an active broker and the others may be licensed as sales associates, or brokers."}, "finalAnswer": "a", "aiReasoning": "Per Gold Coast explanation: all partners who provide real estate services must hold active broker licenses; sales associates cannot be partners. Since all four will perform services, all must be active brokers."}, {"id": "ch5-q27", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q27", "bookPage": null, "question": "What should a sales associate do if a purchaser wishes to present a post-dated check?", "options": {"a": "Obtain approval from the seller and then turn the check over to the broker by close of business on the next business day.", "b": "Check with the broker to make sure the broker agrees with the payment.", "c": "Turn the check over to the broker by close of business the next business day.", "d": "Return the check to the purchaser and ask them for a new one with the correct date."}, "finalAnswer": "a", "aiReasoning": "Per Gold Coast explanation: a postdated check is a promissory note and may be accepted as earnest money only with the seller's approval; the associate must still deliver it to the broker by end of next business day."}, {"id": "ch5-q28", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q28", "bookPage": null, "question": "Which of the following escrow dispute settlement procedures involves the use of Interpleader?", "options": {"a": "The broker asks the Commission for an Escrow Disbursement Order", "b": "Mediation", "c": "Litigation", "d": "Arbitration"}, "finalAnswer": "c", "aiReasoning": "Per Gold Coast explanation: a Bill of Interpleader is a court action - one of the two litigation methods (the other being a Declaratory Decree)."}, {"id": "ch5-q30", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q30", "bookPage": null, "question": "Which business organization can legally register as a real estate brokerage?", "options": {"a": "Corporation Sole", "b": "General Partnership", "c": "Ostensible Partnership", "d": "Joint Venture"}, "finalAnswer": "b", "aiReasoning": "Per Gold Coast explanation: a general partnership can register with the DBPR; corporation sole, ostensible partnership, and joint venture cannot register as a brokerage."}, {"id": "ch5-q31", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q31", "bookPage": null, "question": "There is a dispute over an escrow deposit. The parties agree to have a 3rd party hear both sides and make the final decision. What settlement (escape) procedure is being used?", "options": {"a": "Mediation", "b": "Arbitration", "c": "Interpleader", "d": "Escrow Disbursement Order"}, "finalAnswer": "b", "aiReasoning": "Per Gold Coast explanation: in arbitration the arbitrator hears both sides and issues a binding award; a mediator cannot impose a decision."}, {"id": "ch5-q32", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q32", "bookPage": null, "question": "If a real estate licensee is involved in a personal real estate transaction, which of the following would be correct?", "options": {"a": "The licensee must disclose their license status in any advertising.", "b": "The licensee must disclose the license status on any yard sign using terminology such as 'owner agent.'", "c": "The licensee is not required to disclose their license status in a personal transaction.", "d": "The licensee should disclose their license status prior to entering into any serious negotiations."}, "finalAnswer": "d", "aiReasoning": "Per Gold Coast explanation: disclosure of license status must occur before serious negotiations (not necessarily in preliminary advertising) and should be in writing in the contract."}, {"id": "ch5-q34", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q34", "bookPage": null, "question": "Mary, an Ohio broker, accompanied a customer to Florida and met with broker Stan. While Stan showed the property and obtained a binding contract, Mary went to the beach. Mary demanded a share of the commission. Which statement is correct?", "options": {"a": "Stan may share the commission with Mary.", "b": "Mary violated the real estate license law by accompanying the customer to Florida.", "c": "If Stan pays Mary a share of the commission, Stan will be in violation of the license law.", "d": "If Stan pays Mary a share of the commission, both Stan and Mary will be in violation of the license law."}, "finalAnswer": "a", "aiReasoning": "Per Gold Coast explanation: a Florida broker may share a commission with an out-of-state broker who accompanies a customer but performs no real estate services in Florida. Mary did not participate, so the share is legal."}, {"id": "ch5-q35", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q35", "bookPage": null, "question": "Broker Tom sold a property listed with broker Alice. Tom could not attend the closing, so Alice collected the entire commission and refused to pay Tom his share. What could Alice be charged with?", "options": {"a": "Failure to account", "b": "Collecting an overage", "c": "Commingling", "d": "Fraud"}, "finalAnswer": "a", "aiReasoning": "Per Gold Coast explanation: a broker who collects the full commission and refuses to share as agreed can be charged with failure to account (a form of fraud)."}, {"id": "ch5-q37", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q37", "bookPage": null, "question": "Sal, a properly licensed Arizona broker, refers buyers to Betty, a Florida broker, for 25% of her commission. A competitor files a complaint with the DBPR. What will the investigation most likely determine?", "options": {"a": "The Florida real estate license law was not violated.", "b": "Broker Betty violated F.S. 475 by paying the commission to Sal.", "c": "Since Sal accepted the commission, both brokers violated F.S. 475.", "d": "Sal violated Florida's real estate license law by asking Betty to pay a referral fee."}, "finalAnswer": "a", "aiReasoning": "Per Gold Coast explanation: a Florida broker may pay a referral fee to an out-of-state broker who performs no real estate services in Florida; Sal only referred buyers, so no violation."}, {"id": "ch5-q38", "source": "Chapter 5 Quiz (missed questions)", "sourceRef": "Q38", "bookPage": null, "question": "A home was listed and sold within 24 hours. The buyer felt the broker did not earn the full commission and requested the broker rebate $3,000 at closing. The broker agreed. Which statement is correct?", "options": {"a": "This is a violation of F.S. 475 and the broker would be subject to disciplinary action by the FREC.", "b": "This is a violation of F.S. 120.", "c": "This is legal, provided that all parties are informed and agree.", "d": "This is acceptable, as long as the rebate does not exceed 10% of the purchase price."}, "finalAnswer": "c", "aiReasoning": "Per Gold Coast explanation: rebates/fees are permitted when disclosed to and consented by all interested parties."}, {"id": "gc-q01", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q1", "bookPage": null, "question": "What type of relationship has probably been formed if two or more parties agree to combine their efforts for a single business transaction?", "options": {"a": "Joint venture", "b": "Ostensible partnership", "c": "General partnership", "d": "Business trust"}, "finalAnswer": "a", "aiReasoning": "A joint venture is a temporary combination for a single transaction (or limited series)."}, {"id": "gc-q02", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q2", "bookPage": null, "question": "A city is in need of additional land for a new school. What right would the city have to acquire the land, even over the objections of the property owner?", "options": {"a": "Eminent domain", "b": "Escheat", "c": "Police power", "d": "The city has no such right"}, "finalAnswer": "a", "aiReasoning": "Eminent domain lets government take private property for public use with just compensation."}, {"id": "gc-q03", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q3", "bookPage": null, "question": "Which type of deed would be the best to convey property from the standpoint of the grantor?", "options": {"a": "General warranty", "b": "Quitclaim", "c": "Special warranty", "d": "Bargain and sale"}, "finalAnswer": "b", "aiReasoning": "From the GRANTOR's standpoint a quitclaim deed is best - it makes no warranties and carries the least liability. (General warranty is best for the grantee.)"}, {"id": "gc-q04", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q4", "bookPage": null, "question": "These are all remedies for breach of a real estate contract between a buyer and seller, EXCEPT:", "options": {"a": "Claim from the Real Estate Recovery Fund", "b": "Liquidated damages", "c": "Specific performance", "d": "Compensatory damages"}, "finalAnswer": "a", "aiReasoning": "The Recovery Fund compensates victims of licensee misconduct, not breach-of-contract between buyer and seller."}, {"id": "gc-q05", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q5", "bookPage": null, "question": "An applicant for a real estate license has been denied by the Department of Business and Professional Regulation. Which statement is correct concerning this denial?", "options": {"a": "The denial is final and no appeal may be taken by the applicant.", "b": "An appeal may be filed with the District Court of Appeals within 90 days.", "c": "The Department is not required to inform the applicant of the reason for the denial.", "d": "The applicant must be notified in writing of the reason for the denial and advised of the right to request a formal hearing."}, "finalAnswer": "d", "aiReasoning": "Full option set recovered from the original class photo (IMG_E1283E11, folder 08 screenshots, OCR #78). F.S. 120.60: an agency denying a license must give written notice stating the grounds and inform the applicant of the right to a Ch. 120 hearing. The correct option is d in the recovered layout (previously mislettered b when two options were cut off)."}, {"id": "gc-q06", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q6", "bookPage": null, "question": "Which concept of value pertains to appraisals of profitable business enterprises or opportunities?", "options": {"a": "Goodwill", "b": "Going concern", "c": "Liquidation", "d": "Tangible asset"}, "finalAnswer": "b", "aiReasoning": "Going-concern value applies to a profitable operating business expected to continue."}, {"id": "gc-q07", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q7", "bookPage": null, "question": "A seller and broker enter into a six-month agreement where the seller agrees to pay a commission to the broker, regardless of who actually sells the property. What type of contract is this?", "options": {"a": "Contract for deed", "b": "Open listing", "c": "Exclusive listing", "d": "Exclusive right of sale listing"}, "finalAnswer": "d", "aiReasoning": "Commission owed no matter who sells = exclusive right of sale. (An exclusive listing still lets the owner sell without paying.)"}, {"id": "gc-q08", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q8", "bookPage": null, "question": "These are all examples of eminent domain, EXCEPT:", "options": {"a": "The electric company needs to put up a power substation in a residential area and must take the private property.", "b": "The railroad needs to re-route their trains and must take private property.", "c": "The federal government wishes to construct a small VA outpatient clinic.", "d": "The city wishes to put up a large shopping center/movie theater complex."}, "finalAnswer": "d", "aiReasoning": "A private commercial shopping/theater complex is not a public use; utilities, railroads, and government facilities are classic eminent-domain uses."}, {"id": "gc-q09", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q9", "bookPage": null, "question": "Fred, a licensed sales associate registered with broker Harry, claims Harry failed to pay a commission due him. Fred resigned and became employed under broker Norman before the dispute was resolved. Which statement is correct?", "options": {"a": "Fred cannot bring a legal action for the claimed commission against anyone other than broker Harry.", "b": "Broker Norman must sue broker Harry for the commission due Fred.", "c": "Broker Norman assumed responsibility for the unpaid commission when he employed Fred.", "d": "Fred may file a lis pendens against broker Harry or broker Norman for the commission due him."}, "finalAnswer": "a", "aiReasoning": "Option d recovered from the original class photo (folder 08 screenshots, OCR #78): a lis pendens is not available for a commission claim. A sales associate may seek compensation only from the broker who employed them when it was earned — the action lies against Harry only."}, {"id": "gc-q10", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q10", "bookPage": null, "question": "To qualify for an FHA loan, the housing expense ratio and total obligation ratio cannot exceed which of the following limits?", "options": {"a": "25% and 33%", "b": "28% and 36%", "c": "29% and 37%", "d": "31% and 43%"}, "finalAnswer": "d", "aiReasoning": "FHA benchmark qualifying ratios are 31% housing expense and 43% total obligations."}, {"id": "gc-q11", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q11", "bookPage": null, "question": "What amount must be charged for the state documentary stamp tax on the deed if the property is not located in Dade County and the sale price is $203,500?", "options": {"a": "$712.25", "b": "$1,017.50", "c": "$1,221.00", "d": "$1,424.50"}, "finalAnswer": "d", "aiReasoning": "Doc stamps on deeds outside Miami-Dade are $0.70 per $100: $203,500 / 100 = 2,035 x $0.70 = $1,424.50."}, {"id": "gc-q12", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q12", "bookPage": null, "question": "Three sisters buy a home together. They each own one-third of the property, and the deed does not include any right of survivorship. What type of tenancy is created?", "options": {"a": "Tenancy by the entireties", "b": "Joint tenancy", "c": "Tenancy in common", "d": "Estate in severalty"}, "finalAnswer": "c", "aiReasoning": "Co-ownership without survivorship is a tenancy in common (the default form)."}, {"id": "gc-q13", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q13", "bookPage": null, "question": "What is the most common method used to estimate the value of a single-family home?", "options": {"a": "Cost-depreciation approach", "b": "Income approach", "c": "Sales comparison approach", "d": "Gross rent multiplier"}, "finalAnswer": "c", "aiReasoning": "Single-family homes are valued primarily by the sales comparison approach."}, {"id": "gc-q14", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q14", "bookPage": null, "question": "When an owner dies intestate with no known heirs, the property passes to the government. This is an example of which type of government limitation on private property rights?", "options": {"a": "Police power", "b": "Escheat", "c": "Eminent domain", "d": "Taxation"}, "finalAnswer": "b", "aiReasoning": "Escheat: property of someone who dies intestate without heirs reverts to the state."}, {"id": "gc-q15", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q15", "bookPage": null, "question": "A property owner has been using a portion of a neighbor's property as a driveway for over 20 years without the neighbor's permission. What type of legal right could the property owner claim?", "options": {"a": "Easement by necessity", "b": "Easement in gross", "c": "Easement by prescription", "d": "Encroachment"}, "finalAnswer": "c", "aiReasoning": "Open, continuous, hostile use for the statutory period (20 years in Florida) creates an easement by prescription."}, {"id": "gc-q16", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q16", "bookPage": null, "question": "Which of the following is NOT a primary lender?", "options": {"a": "Mortgage banker", "b": "Savings association", "c": "Life insurance company", "d": "Government National Mortgage Association"}, "finalAnswer": "d", "aiReasoning": "Ginnie Mae operates in the secondary mortgage market; the others originate loans."}, {"id": "gc-q17", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q17", "bookPage": null, "question": "Three persons own a parcel of property. Each individual received a separate deed at the same time. What form of ownership do they hold?", "options": {"a": "Joint tenancy", "b": "Tenancy in common", "c": "Estate in severalty", "d": "Tenancy by the entireties"}, "finalAnswer": "b", "aiReasoning": "Separate deeds break the unity of title required for joint tenancy, so they hold as tenants in common."}, {"id": "gc-q18", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q18", "bookPage": null, "question": "A homeowner in a neighborhood with homes valued in the $100,000 range adds an in-ground pool at a cost of $75,000. This is an example of which of the following?", "options": {"a": "Construction depreciation", "b": "Over-improvement", "c": "Accrued depreciation", "d": "Modified loss in value"}, "finalAnswer": "b", "aiReasoning": "Question and options replaced with the ORIGINAL wording recovered from the class photo (folder 08 screenshots, OCR #69 area). An improvement whose cost greatly exceeds what the neighborhood supports is an over-improvement (superadequacy). NOTE: the earlier ChatGPT transcription had garbled this question and the original AI guess ('incurable depreciation') did not match the real exam item — corrected from source photo."}, {"id": "gc-q19", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q19", "bookPage": null, "question": "Which of the following is a possible disadvantage of investing in real estate?", "options": {"a": "High liquidity", "b": "Lack of leverage", "c": "Illiquidity", "d": "Reduced tax advantages"}, "finalAnswer": "c", "aiReasoning": "Real estate is hard to convert to cash quickly - illiquidity is the classic disadvantage."}, {"id": "gc-q20", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q20", "bookPage": null, "question": "What is the name for a licensee who has passed the state broker license examination but continues to act as a sales associate and be employed under the direction of an actively licensed real estate broker?", "options": {"a": "Broker", "b": "Sales associate", "c": "Broker associate", "d": "Principal broker"}, "finalAnswer": "c", "aiReasoning": "A broker associate holds a broker license but works in a sales associate capacity for another broker."}, {"id": "gc-q21", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q21", "bookPage": null, "question": "How may contractual rights be transferred from one person to another?", "options": {"a": "Assumption", "b": "Assignment", "c": "Subordination", "d": "Renunciation"}, "finalAnswer": "b", "aiReasoning": "Assignment is the transfer of contractual rights to another party."}, {"id": "gc-q22", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q22", "bookPage": null, "question": "What is a broker's proper course of action when they have listed a property and found that the title to the property is NOT merchantable?", "options": {"a": "Notify the Association of REALTORS of the condition of title", "b": "Do nothing, since a broker cannot offer an opinion regarding the condition of title to real property", "c": "Disclose the condition of the title to the buyer at closing", "d": "Immediately notify the owner regarding the condition of the title"}, "finalAnswer": "d", "aiReasoning": "The broker's duty runs to the principal: promptly inform the owner so the title defect can be addressed."}, {"id": "gc-q23", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q23", "bookPage": null, "question": "When a loan is fully repaid, the lender will provide the mortgagor with which document?", "options": {"a": "Deed", "b": "Note", "c": "Promissory note", "d": "Letter of satisfaction"}, "finalAnswer": "d", "aiReasoning": "On payoff the lender delivers a satisfaction of mortgage (here phrased 'letter of satisfaction') to be recorded."}, {"id": "gc-q24", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q24", "bookPage": null, "question": "All of the following statements are true regarding a broker's office, EXCEPT:", "options": {"a": "The office must consist of at least one room where books and records may be maintained and negotiations may be conducted", "b": "The law stipulates the wording required on the broker's office sign", "c": "The office can be located in a motor home provided that directions and advertising of the temporary field office is on file", "d": "All earnest money records must be retained by the broker for at least 5 years"}, "finalAnswer": "c", "aiReasoning": "A broker's office must be in a building of stationary construction - a motor home does not qualify. The other statements are true."}, {"id": "gc-q25", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q25", "bookPage": null, "question": "The value of a business that is failing and not expected to continue would best be determined using which valuation method?", "options": {"a": "Liquidation value", "b": "Cost depreciation", "c": "Comparable sales", "d": "Income"}, "finalAnswer": "a", "aiReasoning": "A business not expected to continue is valued at liquidation value."}, {"id": "gc-q26", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q26", "bookPage": null, "question": "What term refers to the illegal practice of inducing homeowners to list or sell their property by telling them that minorities are moving into their neighborhood?", "options": {"a": "Blockbusting", "b": "Channeling", "c": "Steering", "d": "Redlining"}, "finalAnswer": "a", "aiReasoning": "Inducing sales through fear of minority entry is blockbusting."}, {"id": "gc-q27", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q27", "bookPage": null, "question": "What is the opposite of erosion?", "options": {"a": "Corrosion", "b": "Avulsion", "c": "Redemption", "d": "Accretion"}, "finalAnswer": "d", "aiReasoning": "Accretion is the gradual addition of land by water deposits - the opposite of erosion."}, {"id": "gc-q28", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q28", "bookPage": null, "question": "What is a special assessment?", "options": {"a": "A tax levy that is used to pay for public improvements that add value to the property", "b": "An ad valorem tax", "c": "A tax levy that is based on the value of the property", "d": "A lien imposed by the county tax assessor"}, "finalAnswer": "a", "aiReasoning": "Special assessments fund specific public improvements (sidewalks, sewers) benefiting the assessed properties; they are not ad valorem."}, {"id": "gc-q29", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q29", "bookPage": null, "question": "A listing broker is employed to find a purchaser and produces a full cash offer that meets the seller's terms. The seller refuses to accept the offer because he doesn't like the buyer. Which condition exists?", "options": {"a": "The broker is entitled to compensation since they produced a buyer who met the seller's terms for the sale", "b": "The broker is obligated to find another buyer that the seller likes in order to be compensated", "c": "The broker is not entitled to compensation until the contract is signed by all parties", "d": "The broker is only entitled to compensation when the contract is consummated on the day of closing"}, "finalAnswer": "a", "aiReasoning": "Producing a ready, willing, and able buyer on the seller's terms earns the commission even if the seller refuses to sell."}, {"id": "gc-q30", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q30", "bookPage": null, "question": "Which statute stipulates the time periods during which a party may sue for the enforcement of a contract?", "options": {"a": "Statute of Frauds", "b": "Statute of Allowances", "c": "Statute of Enforcement", "d": "Statute of Limitations"}, "finalAnswer": "d", "aiReasoning": "The statute of limitations sets time limits for bringing legal actions. (Statute of frauds concerns which contracts must be written.)"}, {"id": "gc-q31", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q31", "bookPage": null, "question": "Which federal law requires that borrowers be informed of all settlement costs when funds are obtained from a federally regulated lender?", "options": {"a": "Consumer Credit Cost Disclosure Act", "b": "Fair Housing Act", "c": "Interstate Real Estate Disclosure Act", "d": "Real Estate Settlement Procedures Act"}, "finalAnswer": "d", "aiReasoning": "RESPA requires disclosure of settlement (closing) costs on federally related mortgage loans."}, {"id": "gc-q32", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q32", "bookPage": null, "question": "In a lien theory state, who holds title to mortgaged real property?", "options": {"a": "Mortgagor", "b": "Mortgagee", "c": "Trustee", "d": "Investor"}, "finalAnswer": "a", "aiReasoning": "In lien theory states (like Florida) the borrower (mortgagor) holds title; the lender holds only a lien."}, {"id": "gc-q33", "source": "Gold Coast 33-question practice exam", "sourceRef": "Q33", "bookPage": null, "question": "The concept that states that an informed buyer will pay no more for a property than the cost of acquiring another equally desirable property with the same or equal utility is based upon which of the following?", "options": {"a": "Principle of substitution", "b": "Theory of conformity", "c": "Principle of highest and best use", "d": "Theory of increasing and decreasing returns"}, "finalAnswer": "a", "aiReasoning": "That is the definition of the principle of substitution, the foundation of the sales comparison approach."}];

let order = [], idx = 0, right = 0, wrong = 0, missed = [];

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function start(list){
  order = shuffle(list.slice());
  idx = 0; right = 0; wrong = 0; missed = [];
  document.getElementById('summaryCard').style.display = 'none';
  document.getElementById('quizCard').style.display = 'block';
  render();
}

function render(){
  const q = order[idx];
  document.getElementById('qPos').textContent = idx + 1;
  document.getElementById('qTotal').textContent = order.length;
  document.getElementById('bar').style.width = (idx / order.length * 100) + '%';
  document.getElementById('qSrc').textContent = q.source + ' · ' + q.sourceRef + (q.bookPage ? ' · book p. ' + q.bookPage : '');
  document.getElementById('qText').textContent = q.question;
  const box = document.getElementById('opts');
  box.innerHTML = '';
  for (const k of ['a','b','c','d']){
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = k.toUpperCase() + '.  ' + q.options[k];
    b.onclick = () => answer(k, b);
    b.dataset.k = k;
    box.appendChild(b);
  }
  const fb = document.getElementById('fb');
  fb.className = 'feedback'; fb.innerHTML = '';
  document.getElementById('nextBtn').style.display = 'none';
  updateScore();
}

function answer(k, btn){
  const q = order[idx];
  const correct = q.finalAnswer;
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.k === correct) b.classList.add('correct');
  });
  const fb = document.getElementById('fb');
  if (k === correct){
    right++;
    fb.className = 'feedback good';
    fb.innerHTML = '<b>✅ Correct!</b> ' + esc(q.aiReasoning) + refLine(q);
  } else {
    wrong++; missed.push(q);
    btn.classList.add('wrong');
    fb.className = 'feedback bad';
    fb.innerHTML = '<b>❌ Not quite.</b> The answer is <b>' + correct.toUpperCase() + '</b>. ' + esc(q.aiReasoning) + refLine(q);
  }
  document.getElementById('nextBtn').style.display = 'inline-block';
  document.getElementById('nextBtn').textContent = (idx + 1 < order.length) ? 'Next question →' : 'See my results';
  updateScore();
}

function refLine(q){
  return '<div class="ref">📖 ' + esc(q.source) + ' · ' + esc(q.sourceRef) + (q.bookPage ? ' · book p. ' + q.bookPage : '') + '</div>';
}
function esc(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function updateScore(){
  document.getElementById('nRight').textContent = right;
  document.getElementById('nWrong').textContent = wrong;
  const t = right + wrong;
  document.getElementById('pct').textContent = t ? Math.round(right / t * 100) + '%' : '–';
}

document.getElementById('nextBtn').onclick = () => {
  idx++;
  if (idx < order.length) render(); else finish();
};

function finish(){
  document.getElementById('quizCard').style.display = 'none';
  const s = document.getElementById('summaryCard');
  s.style.display = 'block';
  const pct = Math.round(right / order.length * 100);
  document.getElementById('finalLine').innerHTML =
    'You scored <b>' + right + ' / ' + order.length + ' (' + pct + '%)</b>.' +
    (pct >= 75 ? ' Passing pace — the Florida exam requires 75%. 🎯' : ' The Florida exam requires 75% — keep drilling! 💪');
  const ml = document.getElementById('missedList');
  ml.innerHTML = missed.length ? '<h3>Review these:</h3>' : '<p>Perfect session — nothing missed! 🏆</p>';
  for (const q of missed){
    const d = document.createElement('div');
    d.className = 'missed';
    d.innerHTML = '<b>' + esc(q.question) + '</b><br>Answer: <b>' + q.finalAnswer.toUpperCase() + '.</b> ' +
                  esc(q.options[q.finalAnswer]) + refLine(q);
    ml.appendChild(d);
  }
  document.getElementById('reviewMissedBtn').style.display = missed.length ? 'inline-block' : 'none';
}

document.getElementById('restartBtn').onclick = () => start(BANK);
document.getElementById('reviewMissedBtn').onclick = () => start(missed);

start(BANK);
</script>
