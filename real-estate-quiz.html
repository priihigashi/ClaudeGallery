 the Civil Rights Act of 1866: racial discrimination in property transactions is prohibited with NO exceptions.", "book": {"page": 135, "imgs": {"134": "1p7snnxXd5ZO-FgYlw3rrZuxq_scWPHpU", "135": "1HGynH2RricU9rYnXnTogaO5qARG-QTPC", "136": "1jW1i3wpMokBVSZLFOqzXx84iRTE9BZCJ"}, "hl": [[0.20591502719455296, 0.22490289476182726, 0.47946959850834864, 0.2403885812470407], [0.20591502719455296, 0.2408877093382556, 0.4056564031862745, 0.2563733958234691]], "auto": true}}, {"id": "ch7-q02", "source": "Chapter 7 Practice Exam", "sourceRef": "Q2", "bookPage": 135, "ch": 7, "question": "All of the following are correct regarding the Americans with Disabilities Act, EXCEPT:", "options": {"a": "Owners must make all accessibility modifications with no regard to the cost of improvement.", "b": "ADA is intended to eliminate barriers that limit access to persons with disabilities.", "c": "ADA mandates certain design specifications for accessibility.", "d": "Owners of property open to the public may be required to remove barriers to accessibility."}, "finalAnswer": "a", "aiReasoning": "ADA requires barrier removal only when 'readily achievable' — cost IS considered, so statement a is false.", "book": {"page": 135, "imgs": {"134": "1p7snnxXd5ZO-FgYlw3rrZuxq_scWPHpU", "135": "1HGynH2RricU9rYnXnTogaO5qARG-QTPC", "136": "1jW1i3wpMokBVSZLFOqzXx84iRTE9BZCJ"}, "hl": [[0.20591502719455296, 0.3686150444878472, 0.48948948679406656, 0.3841007117069129], [0.20591502719455296, 0.3845998975965712, 0.40353705212960833, 0.40008556481563684]], "auto": true}}, {"id": "ch7-q03", "source": "Chapter 7 Practice Exam", "sourceRef": "Q3", "bookPage": 135, "ch": 7, "question": "Under the Florida Residential Landlord and Tenant Act, a landlord is required to do all of the following, EXCEPT:", "options": {"a": "Bargain in good faith", "b": "Provide maintenance sufficient to comply with code", "c": "Notify the tenants within 30 days of the manner in which security deposits and advance rents are being held", "d": "Deposit advance rent and security deposits in an interest-bearing account"}, "finalAnswer": "d", "aiReasoning": "An interest-bearing account is only ONE of the landlord's options (non-interest-bearing account or surety bond are also allowed), so it is not required.", "book": {"page": 135, "imgs": {"134": "1p7snnxXd5ZO-FgYlw3rrZuxq_scWPHpU", "135": "1HGynH2RricU9rYnXnTogaO5qARG-QTPC", "136": "1jW1i3wpMokBVSZLFOqzXx84iRTE9BZCJ"}, "hl": [[0.20591502719455296, 0.7359887325402462, 0.48254992915134803, 0.7514743997593119], [0.20591502719455296, 0.7519736241812658, 0.4066761989219516, 0.7674592914003314]], "auto": true}}, {"id": "ch7-q04", "source": "Chapter 7 Practice Exam", "sourceRef": "Q4", "bookPage": 135, "ch": 7, "question": "If a security deposit is held by a landlord, what is the landlord required to do?", "options": {"a": "Deposit the funds in compliance with F.S. 475", "b": "Notify the tenant of the location of the funds within 20 days of receipt of the funds", "c": "Pay interest at the rate of 5% per year, with disbursements at least once each year", "d": "Return the funds within 15 days after the tenant vacates the premises or give notice within 30 days of the intention to impose a claim against the security deposit by certified mail"}, "finalAnswer": "d", "aiReasoning": "F.S. 83.49(3)(a): return deposit within 15 days, or give written notice by certified mail within 30 days of intent to impose a claim.", "book": {"page": 135, "imgs": {"134": "1p7snnxXd5ZO-FgYlw3rrZuxq_scWPHpU", "135": "1HGynH2RricU9rYnXnTogaO5qARG-QTPC", "136": "1jW1i3wpMokBVSZLFOqzXx84iRTE9BZCJ"}, "hl": [[0.5883006675570619, 0.2887665527035492, 0.8858369316150939, 0.30425223918876265], [0.5883006675570619, 0.30475136727997754, 0.7651775085848141, 0.32023705376519096]], "auto": true}}, {"id": "ch7-q05", "source": "Chapter 7 Practice Exam", "sourceRef": "Q5", "bookPage": 135, "ch": 7, "question": "What term is used to describe a situation in which a real estate licensee tells a customer that an advertised property is NOT available for sale when, in fact, it is?", "options": {"a": "Steering", "b": "Restricting", "c": "Conspiring", "d": "Blockbusting"}, "finalAnswer": "a", "aiReasoning": "Misrepresenting that an advertised property is not available when it is, is a fair-housing violation classified in course materials as steering (channeling buyers away from a property/neighborhood). Blockbusting is panic-selling inducement; the other options are not fair-housing terms. Dual-audit concurrence.", "book": {"page": 135, "imgs": {"134": "1p7snnxXd5ZO-FgYlw3rrZuxq_scWPHpU", "135": "1HGynH2RricU9rYnXnTogaO5qARG-QTPC", "136": "1jW1i3wpMokBVSZLFOqzXx84iRTE9BZCJ"}, "hl": [[0.5883006675570619, 0.46444837011472145, 0.6552033767201542, 0.4799340373337871], [0.5883006675570619, 0.6242463468301176, 0.6552033767201542, 0.6397320140491832]], "auto": true}}, {"id": "ch7-q06", "source": "Chapter 7 Practice Exam", "sourceRef": "Q6", "bookPage": 135, "ch": 7, "question": "What term is used to describe the actions of a broker who induces an owner to list or sell on the basis that the neighborhood is deteriorating due to minority influences?", "options": {"a": "Steering", "b": "Channeling", "c": "Conspiring", "d": "Blockbusting"}, "finalAnswer": "d", "aiReasoning": "Inducing owners to sell by exploiting fears of minority entry is blockbusting (panic selling).", "book": {"page": 135, "imgs": {"134": "1p7snnxXd5ZO-FgYlw3rrZuxq_scWPHpU", "135": "1HGynH2RricU9rYnXnTogaO5qARG-QTPC", "136": "1jW1i3wpMokBVSZLFOqzXx84iRTE9BZCJ"}, "hl": [[0.5883006675570619, 0.5124281680945194, 0.6900630277745864, 0.527913835313585], [0.5883006675570619, 0.6721251516631155, 0.6900630277745864, 0.6876108188821812]], "auto": true}}, {"id": "ch7-q07", "source": "Chapter 7 Practice Exam", "sourceRef": "Q7", "bookPage": 136, "ch": 7, "question": "All of the following are protected classes under the 1988 Amendment to the 1968 Fair Housing Act, EXCEPT:", "options": {"a": "People with physical or mental impairments that do not limit major life activities", "b": "Individuals with drug addiction problems who are not current users", "c": "Persons with acquired immune deficiency syndrome (AIDS) and recovering alcoholics", "d": "Women who are pregnant and people with children under the age of 18"}, "finalAnswer": "a", "aiReasoning": "Handicap protection requires an impairment that substantially limits a major life activity; impairments that do NOT limit major life activities are not covered.", "book": {"page": 136, "imgs": {"135": "1HGynH2RricU9rYnXnTogaO5qARG-QTPC", "136": "1jW1i3wpMokBVSZLFOqzXx84iRTE9BZCJ", "137": "1aBO50il8ZRiapM6Xn2vtkgmfm2nO4rKD"}, "hl": [[0.1765032624886706, 0.1365443431969845, 0.42407351225809337, 0.15203002004912405], [0.1765032624886706, 0.15255443495933455, 0.40109095853917737, 0.16804011181147413]], "auto": true}}, {"id": "ch7-q08", "source": "Chapter 7 Practice Exam", "sourceRef": "Q8", "bookPage": 136, "ch": 7, "question": "A property owner is registered on both the state and federal “do not call” lists. Which statement correctly applies to solicitation calls to this owner by a licensee?", "options": {"a": "Calls may be made only between 9:00 a.m. and 8:00 p.m.", "b": "Calls may not be made when representing a buyer.", "c": "Calls could result in a fine of up to $15,000.", "d": "Calls are not permitted when attempting to obtain a listing."}, "finalAnswer": "d", "aiReasoning": "Calling an owner on the do-not-call registries to solicit a LISTING is prohibited telephone solicitation (the licensee is marketing brokerage services). Calling on behalf of a buyer to offer to purchase is not 'solicitation' of the called party. Fine-amount options vary by edition and are distractors. Dual-audit concurrence.", "book": {"page": 136, "imgs": {"135": "1HGynH2RricU9rYnXnTogaO5qARG-QTPC", "136": "1jW1i3wpMokBVSZLFOqzXx84iRTE9BZCJ", "137": "1aBO50il8ZRiapM6Xn2vtkgmfm2nO4rKD"}, "hl": [[0.1765032624886706, 0.503918079414753, 0.41021641251308466, 0.5194037466338186], [0.1765032624886706, 0.5199281711771031, 0.4054124869552313, 0.5354138383961687]], "auto": true}}, {"id": "ch7-q09", "source": "Chapter 7 Practice Exam", "sourceRef": "Q9", "bookPage": 136, "ch": 7, "question": "A real estate licensee refuses to show properties in high-end neighborhoods to minority buyers. The licensee is engaged in which illegal practice?", "options": {"a": "Blockbusting", "b": "Redirecting", "c": "Steering", "d": "Redlining"}, "finalAnswer": "c", "aiReasoning": "Channeling buyers toward or away from neighborhoods based on protected class is steering.", "book": {"page": 136, "imgs": {"135": "1HGynH2RricU9rYnXnTogaO5qARG-QTPC", "136": "1jW1i3wpMokBVSZLFOqzXx84iRTE9BZCJ", "137": "1aBO50il8ZRiapM6Xn2vtkgmfm2nO4rKD"}, "hl": [[0.1765032624886706, 0.6636403401692709, 0.2434058843874464, 0.6791260073883365], [0.1765032624886706, 0.8074281480577257, 0.2434058843874464, 0.8229138152767913]], "auto": true}}, {"id": "ch7-q10", "source": "Chapter 7 Practice Exam", "sourceRef": "Q10", "bookPage": 136, "ch": 7, "question": "A real estate licensee attempts to induce sellers to list and sell their properties by starting rumors that minorities are taking over a neighborhood. What could the licensee be charged with?", "options": {"a": "Steering", "b": "Blockbusting", "c": "Redlining", "d": "Channeling"}, "finalAnswer": "b", "aiReasoning": "Starting panic rumors to induce listings/sales is the definition of blockbusting.", "book": {"page": 136, "imgs": {"135": "1HGynH2RricU9rYnXnTogaO5qARG-QTPC", "136": "1jW1i3wpMokBVSZLFOqzXx84iRTE9BZCJ", "137": "1aBO50il8ZRiapM6Xn2vtkgmfm2nO4rKD"}, "hl": [[0.1765032624886706, 0.6317463499127012, 0.2782655853072023, 0.6472320556640625], [0.1765032624886706, 0.8233372852055714, 0.2782655853072023, 0.838822952424637]], "auto": true}}, {"id": "ch7-q11", "source": "Chapter 7 Practice Exam", "sourceRef": "Q11", "bookPage": 136, "ch": 7, "question": "The Fair Housing Act of 1968 prohibits discrimination based on which of the following?", "options": {"a": "Age", "b": "Marital status", "c": "Occupation", "d": "National origin"}, "finalAnswer": "d", "aiReasoning": "The 1968 Act covered race, color, religion, and national origin (sex added 1974; handicap and familial status added 1988). Age, marital status, and occupation are not federal fair-housing classes.", "book": {"page": 136, "imgs": {"135": "1HGynH2RricU9rYnXnTogaO5qARG-QTPC", "136": "1jW1i3wpMokBVSZLFOqzXx84iRTE9BZCJ", "137": "1aBO50il8ZRiapM6Xn2vtkgmfm2nO4rKD"}, "hl": [[0.5588889028511795, 0.168539239902689, 0.6736766341464971, 0.18402492638790247]], "auto": true}}, {"id": "ch7-q12", "source": "Chapter 7 Practice Exam", "sourceRef": "Q12", "bookPage": 136, "ch": 7, "question": "Which legislation prohibited discrimination based on religion?", "options": {"a": "Civil Rights Act of 1866", "b": "Civil Rights Act of 1968", "c": "Civil Rights Act of 1964", "d": "1988 Fair Housing Amendment"}, "finalAnswer": "b", "aiReasoning": "The Civil Rights Act of 1968 (Title VIII, Fair Housing Act) added religion as a protected class in housing; the 1866 Act covered race only.", "book": {"page": 136, "imgs": {"135": "1HGynH2RricU9rYnXnTogaO5qARG-QTPC", "136": "1jW1i3wpMokBVSZLFOqzXx84iRTE9BZCJ", "137": "1aBO50il8ZRiapM6Xn2vtkgmfm2nO4rKD"}, "hl": [[0.5588889028511795, 0.24838771242083926, 0.7445979398839614, 0.2638733989060527]], "auto": true}}, {"id": "ch7-q13", "source": "Chapter 7 Practice Exam", "sourceRef": "Q13", "bookPage": 136, "ch": 7, "question": "What is the maximum fine that may be imposed for a first time violation of the Florida Fair Housing Act?", "options": {"a": "$5,000", "b": "$10,000", "c": "$25,000", "d": "$50,000"}, "finalAnswer": "b", "aiReasoning": "First violation: up to $10,000 civil penalty ($25,000 for a second within 5 years; $50,000 for further violations within 7 years).", "book": {"page": 136, "imgs": {"135": "1HGynH2RricU9rYnXnTogaO5qARG-QTPC", "136": "1jW1i3wpMokBVSZLFOqzXx84iRTE9BZCJ", "137": "1aBO50il8ZRiapM6Xn2vtkgmfm2nO4rKD"}, "hl": [[0.7591779122944751, 0.32823628126972854, 0.8381011563968035, 0.34372194848879417], [0.5294771381452972, 0.3442210958461569, 0.6432780346839256, 0.35970676306522253]], "auto": true}}, {"id": "ch7-q14", "source": "Chapter 7 Practice Exam", "sourceRef": "Q14", "bookPage": 136, "ch": 7, "question": "What is the first step in the eviction process?", "options": {"a": "The landlord notifies the tenant that they must cure the problem within a specified time period or vacate the property.", "b": "The sheriff posts a 24-hour notice of removal on the tenant's door.", "c": "The county clerk issues an eviction summons.", "d": "The landlord files a motion for default."}, "finalAnswer": "a", "aiReasoning": "Eviction begins with the statutory notice to the tenant (e.g., 3-day notice for nonpayment) to cure or vacate; court steps come later.", "book": {"page": 136, "imgs": {"135": "1HGynH2RricU9rYnXnTogaO5qARG-QTPC", "136": "1jW1i3wpMokBVSZLFOqzXx84iRTE9BZCJ", "137": "1aBO50il8ZRiapM6Xn2vtkgmfm2nO4rKD"}, "hl": [[0.5588889028511795, 0.472024127690479, 0.8457153918696385, 0.48750979490954466], [0.5588889028511795, 0.48793322630602903, 0.7376359927108864, 0.5034188935250947]], "auto": true}}, {"id": "ch7-q15", "source": "Chapter 7 Practice Exam", "sourceRef": "Q15", "bookPage": 136, "ch": 7, "question": "When may a landlord commingle a tenant's security deposit with other business funds?", "options": {"a": "When the landlord pays the tenant 75% of the interest earned", "b": "When the landlord deposits the funds into a non-interest-bearing escrow account", "c": "When the landlord posts a surety bond", "d": "When the landlord places the funds into an escrow account controlled by the property management company"}, "finalAnswer": "c", "aiReasoning": "F.S. 83.49 allows commingling only if the landlord posts a surety bond (and pays the tenant 5% simple interest).", "book": {"page": 136, "imgs": {"135": "1HGynH2RricU9rYnXnTogaO5qARG-QTPC", "136": "1jW1i3wpMokBVSZLFOqzXx84iRTE9B const WEIGHTS = {1:1,2:6,3:2,4:7,5:12,6:3,7:3,8:8,9:7,10:5,11:12,12:9,13:4,14:6,15:1,16:8,17:2,18:3,19:1};
const CHNAMES = {1:'The Real Estate Business',2:'License Law & Qualifications',3:'License Law & FREC Rules',4:'Authorized Relationships',5:'Brokerage Activities & Procedures',6:'Violations, Penalties & Procedures',7:'Federal & State Laws',8:'Real Property',9:'Title, Deeds & Ownership',10:'Legal Descriptions',11:'Real Estate Contracts',12:'Residential Mortgages',13:'Mortgage Types & Finance Sources',14:'Computations & Closing',15:'RE Market & Analysis',16:'Appraisal',17:'Investments & Business Brokerage',18:'Taxes Affecting Real Estate',19:'Planning, Zoning & Env. Hazards'};
const BYID = {}; for (const q of BANK) BYID[q.id] = q;
const SYNC_URL = ''; // Apps Script web app URL — set after Priscila deploys quiz-history-sync.gs

let order = [], idx = 0, right = 0, wrong = 0, missed = [], isRetry = false;

function loadJ(k,d){ try { return JSON.parse(localStorage.getItem(k)) || d; } catch(e){ return d; } }
function saveJ(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

function logAnswer(q, sel, ok, recovered){
  // aggregate per-question stats
  const h = loadJ('reqz_hist', {});
  const e = h[q.id] || {s:0, w:0, weak:0, rec:0};
  e.s++;
  if (!ok) { e.w++; if (isRetry) e.weak++; }       // wrong on final attempt = true weakness
  if (recovered) e.rec++;
  e.last = ok ? 1 : 0; e.t = Date.now();
  h[q.id] = e; saveJ('reqz_hist', h);
  // full attempt log (Codex data model)
  const rec = { questionId: q.id, chapter: q.ch, topic: CHNAMES[q.ch] || '', examWeight: WEIGHTS[q.ch] || 0,
    attemptNumber: isRetry ? 2 : 1, selected: sel, correctAnswer: q.finalAnswer, isCorrect: ok,
    recoveredOnFinalAttempt: !!recovered, timestamp: new Date().toISOString() };
  const log = loadJ('reqz_log', []);
  log.push(rec); while (log.length > 4000) log.shift();
  saveJ('reqz_log', log);
  if (SYNC_URL){
    const queue = loadJ('reqz_queue', []); queue.push(rec); saveJ('reqz_queue', queue); flushQueue();
  }
}
function flushQueue(){
  const queue = loadJ('reqz_queue', []);
  if (!queue.length || !SYNC_URL) return;
  fetch(SYNC_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(queue)})
    .then(() => saveJ('reqz_queue', [])).catch(() => {});
}
function logSession(n, r){
  const s = loadJ('reqz_sessions', []);
  s.push({t: Date.now(), n: n, r: r});
  while (s.length > 60) s.shift();
  saveJ('reqz_sessions', s);
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function show(id){ for (const c of ['quizCard','summaryCard','statsCard']) document.getElementById(c).style.display = (c===id)?'block':'none'; }

function start(list, retry){
  isRetry = !!retry;
  order = shuffle(list.slice());
  idx = 0; right = 0; wrong = 0; missed = [];
  document.getElementById('roundBanner').style.display = isRetry ? 'block' : 'none';
  show('quizCard');
  render();
}

function render(){
  const q = order[idx];
  document.getElementById('qPos').textContent = idx + 1;
  document.getElementById('qTotal').textContent = order.length;
  document.getElementById('bar').style.width = (idx / order.length * 100) + '%';
  document.getElementById('qSrc').textContent = q.source + ' · ' + q.sourceRef + ' · Ch ' + q.ch + ' (' + (WEIGHTS[q.ch]||0) + '% of exam)' + (q.bookPage ? ' · book p. ' + q.bookPage : '');
  document.getElementById('qText').textContent = q.question;
  const box = document.getElementById('opts');
  box.innerHTML = '';
  for (const k of ['a','b','c','d']){
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = k.toUpperCase() + '.  ' + q.options[k];
    b.onclick = () => answer(k, b);
    b.dataset.k = k;
    box.appendChild(b);
  }
  const fb = document.getElementById('fb');
  fb.className = 'feedback'; fb.innerHTML = '';
  document.getElementById('nextBtn').style.display = 'none';
  updateScore();
}

function answer(k, btn){
  const q = order[idx];
  const correct = q.finalAnswer;
  const ok = (k === correct);
  logAnswer(q, k, ok, ok && isRetry);
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.k === correct) b.classList.add('correct');
  });
  const fb = document.getElementById('fb');
  if (ok){
    right++;
    fb.className = 'feedback good';
    fb.innerHTML = '<b>' + (isRetry ? '✅ Recovered!' : '✅ Correct!') + '</b> ' + esc(q.aiReasoning) + refLine(q);
  } else {
    wrong++; missed.push(q);
    btn.classList.add('wrong');
    fb.className = 'feedback bad';
    fb.innerHTML = '<b>' + (isRetry ? '❌ Missed twice — true weakness, logged.' : '❌ Not quite.') + '</b> The answer is <b>' + correct.toUpperCase() + '</b>. ' + esc(q.aiReasoning) + refLine(q);
  }
  document.getElementById('nextBtn').style.display = 'inline-block';
  document.getElementById('nextBtn').textContent = (idx + 1 < order.length) ? 'Next question →' : (missed.length && !isRetry ? 'Final attempt →' : 'See my results');
  updateScore();
}

function refLine(q){
  let s = '<div class="ref">📖 ' + esc(q.source) + ' · ' + esc(q.sourceRef) + (q.bookPage ? ' · book p. ' + q.bookPage : '') + '</div>';
  if (q.book && q.book.imgs && Object.keys(q.book.imgs).length){
    s += '<button class="bookbtn" onclick="bkOpenById(\'' + q.id + '\')">📖 See it in the book — p. ' + q.book.page + '</button>';
  }
  return s;
}
function bkOpenById(id){ const q = BYID[id]; if (q) bkOpen(q); }
function esc(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function updateScore(){
  document.getElementById('nRight').textContent = right;
  document.getElementById('nWrong').textContent = wrong;
  const t = right + wrong;
  document.getElementById('pct').textContent = t ? Math.round(right / t * 100) + '%' : '–';
}

document.getElementById('nextBtn').onclick = () => {
  idx++;
  if (idx < order.length) { render(); return; }
  if (missed.length && !isRetry){ logSession(order.length, right); start(missed, true); return; }
  finish();
};

function finish(){
  if (!isRetry) logSession(order.length, right);
  show('summaryCard');
  const pct = Math.round(right / order.length * 100);
  let head;
  if (isRetry){
    const recovered = order.length - missed.length;
    head = '<b>Final attempt done:</b> recovered <b>' + recovered + ' / ' + order.length + '</b>.' +
           (missed.length ? ' ' + missed.length + ' missed twice — marked as true weaknesses.' : ' All recovered! 🏆');
  } else {
    head = 'You scored <b>' + right + ' / ' + order.length + ' (' + pct + '%)</b>.' +
           (pct >= 75 ? ' Passing pace — the Florida exam requires 75%. 🎯' : ' The Florida exam requires 75% — keep drilling! 💪');
  }
  document.getElementById('finalLine').innerHTML = head;
  const ml = document.getElementById('missedList');
  ml.innerHTML = missed.length ? '<h3>Review these:</h3>' : (isRetry ? '' : '<p>Perfect session — nothing missed! 🏆</p>');
  for (const q of missed){
    const d = document.createElement('div');
    d.className = 'missed';
    d.innerHTML = '<b>' + esc(q.question) + '</b><br>Answer: <b>' + q.finalAnswer.toUpperCase() + '.</b> ' +
                  esc(q.options[q.finalAnswer]) + refLine(q);
    ml.appendChild(d);
  }
  document.getElementById('reviewMissedBtn').style.display = missed.length ? 'inline-block' : 'none';
}

function chapterStats(){
  const h = loadJ('reqz_hist', {});
  const agg = {};
  for (const q of BANK){
    const e = h[q.id];
    if (!agg[q.ch]) agg[q.ch] = {seen:0, wrong:0, weak:0, deck:0};
    agg[q.ch].deck++;
    if (e){ agg[q.ch].seen += e.s; agg[q.ch].wrong += e.w; agg[q.ch].weak += (e.weak||0); }
  }
  return agg;
}

function showStats(){
  show('statsCard');
  const box = document.getElementById('statsBody');
  const sessions = loadJ('reqz_sessions', []);
  const hist = loadJ('reqz_hist', {});
  let html = '';

  html += '<h3>📈 Session history</h3>';
  if (!sessions.length){ html += '<p>No completed sessions yet — finish a round first.</p>'; }
  else {
    for (const s of sessions.slice(-10).reverse()){
      const p = Math.round(s.r / s.n * 100);
      html += '<div class="statrow"><span>' + new Date(s.t).toLocaleDateString() + ' ' + new Date(s.t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + ' — ' + s.r + '/' + s.n + '</span><span class="pbarwrap"><i class="pbar" style="width:' + p + '%;background:' + (p>=75?'var(--green)':'var(--red)') + '"></i></span><b>' + p + '%</b></div>';
    }
    if (sessions.length >= 4){
      const half = Math.floor(sessions.length / 2);
      const avg = a => a.reduce((x,s) => x + s.r/s.n, 0) / a.length * 100;
      const d = avg(sessions.slice(half)) - avg(sessions.slice(0, half));
      html += '<p><b>Trend:</b> ' + (d > 2 ? '⬆️ improving (+' + d.toFixed(0) + ' pts vs earlier sessions)' : d < -2 ? '⬇️ slipping (' + d.toFixed(0) + ' pts)' : '➡️ steady') + '</p>';
    }
  }

  const agg = chapterStats();
  let wSum = 0, wAcc = 0;
  for (const ch in agg){ const a = agg[ch]; if (a.seen){ wSum += WEIGHTS[ch]||0; wAcc += (WEIGHTS[ch]||0) * (1 - a.wrong/a.seen); } }
  if (wSum) html += '<h3>🏛️ Exam-weighted score</h3><p>Weighted by official DBPR chapter percentages: <b>' + Math.round(wAcc/wSum*100) + '%</b> (75% needed to pass).</p>';

  html += '<h3>🎯 What to study first (weakness × exam weight)</h3>';
  const rows = [];
  for (const ch in agg){
    const a = agg[ch];
    if (!a.seen) continue;
    const acc = 1 - a.wrong / a.seen;
    rows.push({ch:+ch, acc, seen:a.seen, weak:a.weak, prio:(WEIGHTS[ch]||0)*(1-acc)});
  }
  rows.sort((x,y) => y.prio - x.prio);
  if (!rows.length) html += '<p>Answer some questions first.</p>';
  const maxp = Math.max(...rows.map(r => r.prio), 0.01);
  for (const r of rows){
    html += '<div class="statrow"><span><b>Ch ' + r.ch + '</b> ' + CHNAMES[r.ch] + ' · ' + WEIGHTS[r.ch] + '% of exam · ' + Math.round(r.acc*100) + '% right (' + r.seen + ' answers' + (r.weak ? ', ' + r.weak + ' missed twice' : '') + ')</span><span class="pbarwrap"><i class="pbar" style="width:' + Math.round(r.prio/maxp*100) + '%;background:var(--red)"></i></span></div>';
  }
  const next = rows.filter(r => r.acc < 0.8).slice(0, 3);
  if (next.length) html += '<p><b>📌 Study this next:</b> ' + next.map(r => 'Ch ' + r.ch + ' — ' + CHNAMES[r.ch] + ' (book p. ~' + ({1:1,2:13,3:35,4:49,5:67,6:95,7:115,8:129,9:145,10:163,11:181,12:207,13:225,14:255,15:279,16:293,17:319,18:341,19:357}[r.ch]) + ')').join(' · ') + '</p>';

  const missedTwice = BANK.filter(q => hist[q.id] && (hist[q.id].weak || 0) > 0)
                          .sort((a,b) => (hist[b.id].weak||0) - (hist[a.id].weak||0));
  const missedAny = BANK.filter(q => hist[q.id] && hist[q.id].w > 0);
  html += '<h3>🔥 True weaknesses — missed twice in a session (' + missedTwice.length + ')</h3>';
  for (const q of missedTwice.slice(0, 15)){
    html += '<div class="missed"><b>' + esc(q.question) + '</b><br>Answer: <b>' + q.finalAnswer.toUpperCase() + '.</b> ' + esc(q.options[q.finalAnswer]) + refLine(q) + '</div>';
  }
  html += '<h3>🔁 All-time missed: ' + missedAny.length + ' question' + (missedAny.length===1?'':'s') + '</h3>';
  document.getElementById('practiceWeakBtn').style.display = missedAny.length ? 'inline-block' : 'none';
  document.getElementById('practiceWeak2Btn').style.display = missedTwice.length ? 'inline-block' : 'none';
  box.innerHTML = html;
}

function backupHistory(){
  const data = {hist: loadJ('reqz_hist',{}), sessions: loadJ('reqz_sessions',[]), log: loadJ('reqz_log',[]), exported: new Date().toISOString()};
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'quiz-history-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}
function restoreHistory(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    f.text().then(t => {
      try {
        const d = JSON.parse(t);
        if (d.hist) saveJ('reqz_hist', d.hist);
        if (d.sessions) saveJ('reqz_sessions', d.sessions);
        if (d.log) saveJ('reqz_log', d.log);
        alert('History restored ✅'); showStats();
      } catch(e){ alert('Could not read that file'); }
    });
  };
  inp.click();
}

document.getElementById('restartBtn').onclick = () => start(BANK, false);
document.getElementById('reviewMissedBtn').onclick = () => start(missed, true);
document.getElementById('statsBtn').onclick = showStats;
document.getElementById('statsBtn2').onclick = showStats;
document.getElementById('statsBackBtn').onclick = () => start(BANK, false);
document.getElementById('practiceWeakBtn').onclick = () => {
  const hist = loadJ('reqz_hist', {});
  const w = BANK.filter(q => hist[q.id] && hist[q.id].w > 0);
  if (w.length) start(w, false);
};
document.getElementById('practiceWeak2Btn').onclick = () => {
  const hist = loadJ('reqz_hist', {});
  const w = BANK.filter(q => hist[q.id] && (hist[q.id].weak || 0) > 0);
  if (w.length) start(w, false);
};
document.getElementById('backupBtn').onclick = backupHistory;
document.getElementById('restoreBtn').onclick = restoreHistory;
flushQueue();

start(BANK, false);
</script>

<div id="bkModal" onclick="if(event.target===this)bkClose()">
 <div id="bkBox">
  <div id="bkHead">
   <button onclick="bkNav(-1)">&#9664;</button>
   <b id="bkTitle"></b>
   <button onclick="bkNav(1)">&#9654;</button>
   <button onclick="bkClose()" style="border-color:#c62828;color:#c62828">Close</button>
  </div>
  <div id="bkNote"></div>
  <div id="bkScroll"><div id="bkImgWrap"><img id="bkImg" alt="book page"></div></div>
 </div>
</div>
<script>
let bkQ = null, bkCur = 0;
function bkOpen(q){ bkQ = q; bkCur = q.book.page; bkRender(); document.getElementById('bkModal').classList.add('open'); }
function bkClose(){ document.getElementById('bkModal').classList.remove('open'); }
function bkNav(d){ if(!bkQ) return; const pages = Object.keys(bkQ.book.imgs).map(Number).sort((a,b)=>a-b);
  const i = pages.indexOf(bkCur); const j = i + d; if(j < 0 || j >= pages.length) return; bkCur = pages[j]; bkRender(); }
function bkRender(){
  const b = bkQ.book, id = b.imgs[String(bkCur)];
  document.getElementById('bkTitle').textContent = 'Book — page ' + bkCur + (bkCur === b.page ? ' (matched)' : '');
  document.getElementById('bkNote').textContent = b.auto ? 'Page auto-matched to this question — use the arrows to flip if the explanation continues on a neighboring page.' : 'Verified page reference.';
  const wrap = document.getElementById('bkImgWrap');
  wrap.querySelectorAll('.bkhl').forEach(e => e.remove());
  const img = document.getElementById('bkImg');
  img.src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1400';
  if(bkCur === b.page && b.hl && b.hl.length){
    for(const r of b.hl){
      const d = document.createElement('div'); d.className = 'bkhl';
      d.style.left = (r[0]*100) + '%'; d.style.top = (r[1]*100) + '%';
      d.style.width = ((r[2]-r[0])*100) + '%'; d.style.height = ((r[3]-r[1])*100) + '%';
      wrap.appendChild(d);
    }
  }
}
</script>
</body>
