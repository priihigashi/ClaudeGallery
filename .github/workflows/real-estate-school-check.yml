name: Real estate school regression check
on:
  push:
    paths:
      - '.github/workflows/real-estate-school-check.yml'
      - 'real-estate-study*'
      - 'real-estate-schools*'
      - 'real-estate-ai-classroom*'
      - 'cameron-bank.enc.json'
      - 'cameron-section-3.enc.json'
      - 'cameron-section-4.enc.json'
      - 'cameron-section-5.enc.json'
      - 'cameron-section-6.enc.json'
      - 'cameron-pt-study*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve Gold Coast book references
        run: node real-estate-quiz.test.js
      - name: Validate school isolation, study aids, and AI Classroom launcher
        run: |
          node real-estate-schools.test.cjs
          node real-estate-schools-extra.test.cjs
          node real-estate-schools-section5.test.cjs
          node real-estate-schools-section6.test.cjs
          node real-estate-study-aids.test.cjs
          node real-estate-ai-classroom-launcher.test.cjs
      - name: Verify browser interactions
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            node real-estate-schools.e2e.cjs
          else
            env -u GITHUB_ACTIONS node real-estate-schools.e2e.cjs
          fi
          node real-estate-study-aids.e2e.cjs
      - name: Save fixture-only browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-estate-school-browser-check
          retention-days: 3
          path: school-test-screenshots/
      - name: Package exact source for regression review
        uses: actions/upload-artifact@v4
        with:
          name: real-estate-school-source
          retention-days: 3
          path: |
            real-estate-quiz.html
            real-estate-quiz.test.js
            real-estate-quiz.MANUAL.md
            real-estate-quiz.AUDIT.md
            real-estate-study*
            real-estate-schools*
            real-estate-ai-classroom*
            cameron-bank.enc.json
            cameron-section-3.enc.json
            cameron-section-4.enc.json
            cameron-section-5.enc.json
            cameron-section-6.enc.json
            cameron-pt-study*
