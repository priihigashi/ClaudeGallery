<style>
  :root{
    --bg:#0c0a0f; --bg2:#15101c; --pink:#D88FAC; --pink-soft:#e7b3c8; --pink-dim:rgba(216,143,172,.14);
    --glass:rgba(255,255,255,.055); --glass-strong:rgba(255,255,255,.09);
    --stroke:rgba(255,255,255,.12); --stroke-pink:rgba(216,143,172,.35);
    --text:#f3eef2; --muted:#b3a9b6; --muted2:#8c8290; --good:#7fd1a8; --bad:#e89090;
    --shadow:0 18px 50px -20px rgba(0,0,0,.8); --radius:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);
    background:
      radial-gradient(1100px 600px at 8% -8%, rgba(216,143,172,.18), transparent 60%),
      radial-gradient(900px 600px at 108% 8%, rgba(140,90,180,.16), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, #0a0810 100%);
    background-attachment:fixed;min-height:100vh;line-height:1.5;padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 80px}
  header{padding:26px 4px 8px}
  .hello{font-size:13px;color:var(--pink-soft);letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  h1{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(30px,8vw,42px);margin:4px 0 2px;letter-spacing:.3px;line-height:1.05}
  h1 .accent{color:var(--pink)}
  .date{color:var(--muted);font-size:14px;font-weight:500}
  .date-note{font-size:12px;color:var(--pink-soft);margin-top:3px;display:none}
  .date-note.stale{display:block;color:#e8c07a}
  .sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted2);margin-left:8px;vertical-align:middle}
  .sync-dot.live{background:var(--good)} .sync-dot.cache{background:var(--pink)}
  .scroller{display:flex;gap:8px;overflow-x:auto;padding:14px 4px 6px;scrollbar-width:none;-ms-overflow-style:none}
  .scroller::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--stroke);background:var(--glass);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.18s;backdrop-filter:blur(8px);white-space:nowrap}
  .chip .d{font-size:11px;display:block;color:var(--muted2);font-weight:500}
  .chip.active{background:var(--pink);color:#1a0e14;border-color:var(--pink);box-shadow:0 6px 18px -6px var(--pink)}
  .chip.active .d{color:#3a1f2b}
  .hl-head{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 8px}
